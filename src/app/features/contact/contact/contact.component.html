<div class="container">
    <div class="screen">
        <div class="screen__content">
            <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="login">
                <h3>Contáctanos</h3>
                <div class="login__field">
                    <i class="login__icon fas fa-user"></i>
                    <input type="text" class="login__input" placeholder="Nombre" formControlName="name" required>
                    <!-- Removed extra closing div -->
                    <div class="login__field">
                        <i class="login__icon fas fa-envelope"></i>
                        <input type="email" class="login__input" placeholder="Email" formControlName="email" required>
                    </div>
                    <div class="login__field">
                        <i class="login__icon fas fa-comment"></i>
                        <textarea class="login__input" placeholder="Mensaje" formControlName="message" rows="4"
                            required></textarea>
                    </div>
                    <button class="button login__submit" type="submit">
                        <span class="button__text">Enviar</span>
                        <i class="button__icon fas fa-paper-plane"></i>
                    </button>
                </div>
            </form>
        </div>
        <div class="screen__background">
            <span class="screen__background__shape screen__background__shape4"></span>
            <span class="screen__background__shape screen__background__shape3"></span>
            <span class="screen__background__shape screen__background__shape2"></span>
            <span class="screen__background__shape screen__background__shape1"></span>
        </div>
    </div>
</div>
